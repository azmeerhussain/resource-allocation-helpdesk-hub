spring:
  application:
    name: helpdesk-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USERNAME:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

server:
  port: 8080

helpdesk:
  seed: ${HELPDESK_SEED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
