spring:
  application:
    name: helpdesk-hub
  datasource:
    url: jdbc:h2:mem:helpdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

helpdesk:
  seed: false
  overdue-check-ms: 3600000
