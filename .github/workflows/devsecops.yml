# AI Contribution Weight: [100%] AI Generated / [0%] Human Refactored
# Generated by: Claude (claude-opus-5-5) agent session - see code_AI_history.md (entry PA1-05)
# PA2 update (AI, student prompt PA2-01): added functional-build-test and functional-docker jobs for
# PA2/functional-codebase/, Semgrep JSON output for triage, SonarQube now analyses PA2/functional-codebase/.
#
# DevSecOps pipeline for the Resource Allocation & Help Desk Hub (Java 21 / Spring Boot / Maven).
#   1. build-test  : compile + unit tests (Maven)
#   2. docker      : multi-stage Docker build, docker compose up (app + PostgreSQL), smoke test
#                    + Trivy dependency/filesystem scan and container image scan
#   3. semgrep     : SAST (Java, secrets, Dockerfile rulesets)
#   4. sonarqube   : SAST / code quality via SonarQube Cloud
# All security scans are NON-BLOCKING in Phase 1 (they report findings but never fail the build),
# as required by PA1 ("successful, non-blocking SAST and dependency scanning telemetry").
# Findings are uploaded as build artifacts and to GitHub Code Scanning (SARIF).

name: DevSecOps Pipeline

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.57.1
  APP_IMAGE: rahub:ci

jobs:
  build-test:
    name: Build & Unit Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Docker Build, Smoke Test & Trivy Scans
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image and start stack (app + PostgreSQL)
        run: |
          docker compose build
          docker tag rahub:local "$APP_IMAGE"
          docker compose up -d

      - name: Smoke test (wait for health, call /api/v1/ping)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health; then echo; break; fi
            echo "waiting for app ($i)..."; sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/api/v1/ping
          echo
          docker compose ps

      - name: Dump container logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt; tail -n 50 compose-logs.txt

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Trivy - dependency / filesystem scan (non-blocking)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD":/src "$TRIVY_IMAGE" fs --scanners vuln,secret,misconfig \
            --exit-code 0 --format table --output /src/reports/trivy-fs.txt /src
          docker run --rm -v "$PWD":/src "$TRIVY_IMAGE" fs --scanners vuln,secret,misconfig \
            --exit-code 0 --format sarif --output /src/reports/trivy-fs.sarif /src
          cat reports/trivy-fs.txt

      - name: Trivy - container image scan (non-blocking)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/src "$TRIVY_IMAGE" \
            image --exit-code 0 --format table --output /src/reports/trivy-image.txt "$APP_IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/src "$TRIVY_IMAGE" \
            image --exit-code 0 --format sarif --output /src/reports/trivy-image.sarif "$APP_IMAGE"
          cat reports/trivy-image.txt

      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy image SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy reports and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            reports/
            compose-logs.txt

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan (non-blocking)
        run: |
          mkdir -p reports
          semgrep scan --config p/java --config p/secrets --config p/dockerfile \
            --metrics=off --sarif --output reports/semgrep.sarif || true
          semgrep scan --config p/java --config p/secrets --config p/dockerfile \
            --metrics=off --text --output reports/semgrep.txt || true
          semgrep scan --config p/java --config p/secrets --config p/dockerfile \
            --metrics=off --json --output reports/semgrep.json || true
          cat reports/semgrep.txt

      - name: Upload Semgrep SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: reports/

  functional-build-test:
    name: functional-codebase - Build & API Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PA2/functional-codebase
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run API integration tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-surefire-reports
          path: PA2/functional-codebase/target/surefire-reports/

  functional-docker:
    name: functional-codebase - Docker Compose, Smoke Test & Trivy
    runs-on: ubuntu-latest
    needs: functional-build-test
    env:
      FUNCTIONAL_IMAGE: helpdesk-functional:local
    steps:
      - uses: actions/checkout@v4

      - name: Build image and start stack (service + PostgreSQL)
        working-directory: PA2/functional-codebase
        run: |
          docker compose build
          docker compose up -d

      - name: End-to-end smoke test
        working-directory: PA2/functional-codebase
        run: ./smoke-test.sh

      - name: Dump container logs
        if: always()
        working-directory: PA2/functional-codebase
        run: docker compose logs --no-color > ../../functional-compose-logs.txt; tail -n 80 ../../functional-compose-logs.txt

      - name: Stop stack
        if: always()
        working-directory: PA2/functional-codebase
        run: docker compose down -v

      - name: Trivy - dependency scan + image scan (non-blocking)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD":/src "$TRIVY_IMAGE" fs --scanners vuln,secret,misconfig \
            --exit-code 0 --format table --output /src/reports/trivy-functional-fs.txt /src/PA2/functional-codebase
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/src "$TRIVY_IMAGE" \
            image --exit-code 0 --format table --output /src/reports/trivy-functional-image.txt "$FUNCTIONAL_IMAGE"
          cat reports/trivy-functional-fs.txt reports/trivy-functional-image.txt

      - name: Upload reports and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-trivy-reports
          path: |
            reports/
            functional-compose-logs.txt

  sonarqube:
    name: SAST - SonarQube Cloud (functional-codebase)
    runs-on: ubuntu-latest
    needs: functional-build-test
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SonarQube Cloud analysis (non-blocking)
        if: env.SONAR_TOKEN != ''
        working-directory: PA2/functional-codebase
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=false

      - name: Export SonarQube Cloud findings for triage (non-blocking)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          mkdir -p reports
          K=azmeerhussain_resource-allocation-helpdesk-hub
          # wait for SonarQube Cloud to finish processing this analysis
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/ce/component?component=$K" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("busy" if d.get("queue") else "done")')
            [ "$STATUS" = "done" ] && break; echo "waiting for SonarQube Cloud processing ($i)..."; sleep 10
          done
          curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=$K&branch=main&resolved=false&ps=500" -o reports/sonar-issues.json
          curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/hotspots/search?projectKey=$K&branch=main&ps=500" -o reports/sonar-hotspots.json
          curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$K&branch=main" -o reports/sonar-quality-gate.json
          python3 - <<'EOF'
          import json
          i = json.load(open("reports/sonar-issues.json"))
          h = json.load(open("reports/sonar-hotspots.json"))
          g = json.load(open("reports/sonar-quality-gate.json"))
          print("QUALITY GATE:", g["projectStatus"]["status"])
          for c in g["projectStatus"].get("conditions", []):
              print("  condition", c.get("metricKey"), c.get("status"), "actual=", c.get("actualValue"), "threshold=", c.get("errorThreshold"))
          print(f"ISSUES: {i['total']}")
          for x in i["issues"]:
              comp = x["component"].split(":", 1)[1]
              print(f"ISSUE | {x.get('type')} | {x.get('severity')} | {x['rule']} | {comp}:{x.get('line')} | {x['message']}")
          print(f"HOTSPOTS: {h['paging']['total']}")
          for x in h["hotspots"]:
              comp = x["component"].split(":", 1)[1]
              print(f"HOTSPOT | {x['securityCategory']} | {x['vulnerabilityProbability']} | {x['ruleKey']} | {comp}:{x.get('line')} | {x['message']}")
          EOF

      - name: Upload SonarQube findings
        if: always() && env.SONAR_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: reports/

      - name: Skip notice (no token configured)
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN secret not set - SonarQube Cloud analysis skipped."

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-test, docker, functional-build-test, functional-docker, semgrep, sonarqube]
    if: always()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## DevSecOps pipeline summary"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Build & unit tests | ${{ needs.build-test.result }} |"
            echo "| Docker build + smoke test + Trivy | ${{ needs.docker.result }} |"
            echo "| functional-codebase build + API integration tests | ${{ needs.functional-build-test.result }} |"
            echo "| functional-codebase Docker Compose + smoke test + Trivy | ${{ needs.functional-docker.result }} |"
            echo "| Semgrep SAST | ${{ needs.semgrep.result }} |"
            echo "| SonarQube Cloud SAST | ${{ needs.sonarqube.result }} |"
            echo ""
            echo "Scans are non-blocking. Reports: see the run's Artifacts and the Security > Code scanning tab."
          } >> "$GITHUB_STEP_SUMMARY"
