# Single-tenant stack: this service + its own PostgreSQL. No other PP services.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rahub
      POSTGRES_USER: rahub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rahub_local_dev}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahub -d rahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: rahub:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/rahub
      DB_USERNAME: rahub
      DB_PASSWORD: ${DB_PASSWORD:-rahub_local_dev}
    ports:
      - "8080:8080"

volumes:
  db-data:
